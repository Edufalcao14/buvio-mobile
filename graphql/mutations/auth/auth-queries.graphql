query Me {
  me {
    id
    email
    displayName
    team {
      id
      name
      code
      sport
      creator {
        id
        displayName
        externalId
        email
      }
    }
  }
}
query validateTeamCode($code: String!) {
  validateTeamCode(code: $code)
}

query GetTeamMembers {
  getTeamMembers {
    id
    displayName
    email
    createdAt
    updatedAt
    deletedAt
    externalId
    team {
      name
      code
      sport
      creator {
        displayName
        email
      }
      createdAt
      updatedAt
    }
  }
}