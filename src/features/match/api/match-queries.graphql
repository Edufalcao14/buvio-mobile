# Paged. The archive grows without bound in time - a club two seasons in has
# hundreds of matches - and this screen used to fetch every one of them on each
# visit. The page size is the caller's, so the screen decides how much to show.
query TeamHistory($limit: Int, $offset: Int) {
  me {
    id
    team {
      id
      name
      code
      sport
      matches(limit: $limit, offset: $offset) {
        id
        name
        date
        type
        players {
          id
          displayName
          nickname
          avatarUrl
        }
        votingSession {
          id
          status
          timeRemaining
          voteResult {
            top {
              id
              displayName
              nickname
              avatarUrl
            }
            flop {
              id
              displayName
              nickname
              avatarUrl
            }
          }
        }
      }
    }
  }
}
