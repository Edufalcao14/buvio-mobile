query Me {
  me {
    id
    email
    displayName
    nickname
    avatarUrl
    team {
      id
      name
      code
      sport
      crestUrl
      creator {
        id
        displayName
        nickname
      }
    }
  }
}
query validateTeamCode($code: String!) {
  validateTeamCode(code: $code)
}

# Data minimisation: the roster renders nicknames and avatars, so it asks for
# nicknames and avatars. It used to pull every teammate's email address, their
# soft-deletion state and their external id into device memory with no screen
# that showed any of it.
query GetTeamMembers {
  getTeamMembers {
    id
    displayName
    nickname
    avatarUrl
    team {
      id
      name
      code
      sport
      crestUrl
      creator {
        id
        displayName
        nickname
      }
    }
  }
}
