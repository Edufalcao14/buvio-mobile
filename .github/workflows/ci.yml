name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, format, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # bun's global cache; the lockfile is the key, so a dependency change
      # invalidates it and nothing else does.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Formatting used to be enforced only by the local pre-commit hook, so a
      # --no-verify commit introduced drift nothing ever caught.
      - name: Format check
        run: bun run format:check

      # The committed hooks must match the committed documents and schema. The
      # schema is vendored, so this runs offline and catches contract drift
      # before it reaches a device.
      - name: GraphQL codegen drift
        run: |
          bun run generate
          git diff --exit-code src/graphql/generated \
            || (echo "::error::Generated GraphQL is stale. Run 'bun run generate'." && exit 1)

      - name: Tests with coverage
        run: bun run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      # Advisory for now: the current tree carries known toolchain advisories
      # that only clear with an upstream SDK patch. It reports on every PR so a
      # NEW one is visible, which is the thing that was missing entirely.
      - name: bun audit
        continue-on-error: true
        run: bun audit

  build:
    name: Build check
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile

      # Proves the app actually bundles for a device, which lint and tests do
      # not: a broken asset path or a native-only import fails here and only
      # here. The export is also what a Maestro job would install.
      - name: Export production bundle
        run: bunx expo export --platform all --output-dir dist
        env:
          EXPO_PUBLIC_ENV: production
          EXPO_PUBLIC_URL_PRODUCTION: https://api.buvio.app

      # The audit found images were 22 of 29 MB. A budget keeps it that way.
      - name: Bundle size budget
        run: |
          SIZE_KB=$(du -sk dist | cut -f1)
          echo "Bundle: ${SIZE_KB} KB (budget 20480 KB)"
          if [ "$SIZE_KB" -gt 20480 ]; then
            echo "::error::Bundle is ${SIZE_KB} KB, over the 20 MB budget."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/
          retention-days: 7
