# Creates a brand new account and stops on the welcome screen (no team yet).
# Callers get the generated address back as `output.email`.
appId: com.anonymous.BuvioFrontend
---
- clearState
- launchApp
- assertVisible: "Inscription"

- evalScript: ${output.email = 'maestro-' + Date.now() + '@buvio.test'}

- tapOn:
    id: "input-displayName"
- inputText: "Maestro Tester"

- tapOn:
    id: "input-email"
- inputText: ${output.email}

- tapOn:
    id: "input-password"
- inputText: "Buvio2026!secret"

- tapOn:
    id: "input-confirmPassword"
- inputText: "Buvio2026!secret"

- hideKeyboard
- tapOn: "S'inscrire"

- assertVisible: "Bienvenue sur Buvio !"
